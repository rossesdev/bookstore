services:
  pgdatabase:
    image: postgres:18.6
    restart: unless-stopped
    shm_size: 256mb
    environment:
      POSTGRES_DB: bookstore
      POSTGRES_USER: bookstore_admin
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - bookstore_data:/var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookstore_admin -d bookstore"]
      interval: 10s
      timeout: 5s
      retries: 5

secrets:
  postgres_password:
    file: ./secrets/postgres_password

volumes:
  bookstore_data:
